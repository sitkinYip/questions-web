<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="__UI_COPY_DESCRIPTION__" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%compass.svg" />
    <meta name="theme-color" content="#10110f" />
    <script>
      (() => {
        const key = "questions:v1:theme";
        const allowedPreferences = ["system", "light", "dark"];
        const queryPreference = new URLSearchParams(location.search).get(
          "theme",
        );
        let preference = allowedPreferences.includes(queryPreference)
          ? queryPreference
          : "system";
        if (!allowedPreferences.includes(queryPreference)) {
          try {
            const stored = JSON.parse(localStorage.getItem(key) || "null");
            if (
              stored?.version === 1 &&
              allowedPreferences.includes(stored.preference)
            )
              preference = stored.preference;
          } catch {}
        }
        const systemDark = window.matchMedia?.(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme =
          preference === "system"
            ? systemDark === false
              ? "light"
              : "dark"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#10110f" : "#f4f0e7");
      })();
    </script>
    <title>__UI_COPY_TITLE__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
