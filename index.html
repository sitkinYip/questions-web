<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="__UI_COPY_DESCRIPTION__" />
    <meta name="application-name" content="__UI_COPY_TITLE__" />
    <meta name="apple-mobile-web-app-title" content="__UI_COPY_TITLE__" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%branding/starward-icon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="%BASE_URL%branding/starward-icon-48.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%branding/starward-icon-180.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        const key = "starward:v1:theme";
        const legacyKey = "questions:v1:theme";
        const allowedPreferences = ["system", "light", "dark"];
        const queryPreference = new URLSearchParams(location.search).get(
          "theme",
        );
        let preference = allowedPreferences.includes(queryPreference)
          ? queryPreference
          : "system";
        if (!allowedPreferences.includes(queryPreference)) {
          try {
            const stored = JSON.parse(
              localStorage.getItem(key) ??
                localStorage.getItem(legacyKey) ??
                "null",
            );
            if (
              stored?.version === 1 &&
              allowedPreferences.includes(stored.preference)
            )
              preference = stored.preference;
          } catch {}
        }
        const systemDark = window.matchMedia?.(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme =
          preference === "system"
            ? systemDark === false
              ? "light"
              : "dark"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#000000" : "#ffffff");
      })();
    </script>
    <title>__UI_COPY_TITLE__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
