name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check style architecture
        run: pnpm check:styles

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:run

      - name: Build preview
        run: pnpm build:preview

      - name: Verify preview asset base
        run: |
          grep -Fq '/questions-next/assets/' dist/index.html
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo 'Preview build contains a root /assets/ reference.' >&2
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Check formatting
        run: pnpm format:check
