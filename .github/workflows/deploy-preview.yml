name: Deploy Questions Preview

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: questions-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      QUESTIONS_RELEASE_NUMBER: ${{ github.run_number }}
      QUESTIONS_RELEASE_ATTEMPT: ${{ github.run_attempt }}
      REMOTE_HOST: ${{ secrets.HOST }}
      REMOTE_USER: ${{ secrets.USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      QUESTIONS_ROOT: ${{ secrets.QUESTIONS_ROOT }}
      VITE_POCKETBASE_URL: ${{ vars.QUESTIONS_POCKETBASE_URL || 'https://api.sitkin.top' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check backend API compatibility (read-only)
        run: node scripts/verify-game-deployment.mjs

      - name: Build preview
        run: pnpm build:preview

      - name: Verify preview artifact
        run: node scripts/verify-build-artifact.mjs preview

      - name: Record release identity
        run: |
          node -e 'const v=require("./dist/version.json"); const fs=require("node:fs"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Release: ${v.channel} v${v.version}\n\nCommit: ${v.commit}\n\nBuilt: ${v.builtAt}\n`);'

      - name: Configure SSH
        run: |
          test -n "$REMOTE_HOST"
          test -n "$REMOTE_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$QUESTIONS_ROOT"
          test "${QUESTIONS_ROOT#/}" != "$QUESTIONS_ROOT"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy preview files
        run: |
          remote_path="${QUESTIONS_ROOT%/}/questions-next"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/id_ed25519" \
            "$REMOTE_USER@$REMOTE_HOST" "mkdir -p -- '$remote_path'"
          rsync --archive --compress --delete \
            -e "ssh -p $SSH_PORT -i $HOME/.ssh/id_ed25519" \
            dist/ "$REMOTE_USER@$REMOTE_HOST:$remote_path/"

      - name: Smoke test preview routes
        run: |
          urls=(
            'https://sitkin.top/questions-next/'
            'https://sitkin.top/questions-next/login'
            'https://sitkin.top/questions-next/profile'
            'https://sitkin.top/questions-next/rewards'
            'https://sitkin.top/questions-next/notifications'
          )
          for url in "${urls[@]}"; do
            html="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "$url")"
            if ! printf '%s' "$html" | grep -Fq '/questions-next/assets/'; then
              echo "Preview route did not return the Questions HTML: $url" >&2
              exit 1
            fi
          done
